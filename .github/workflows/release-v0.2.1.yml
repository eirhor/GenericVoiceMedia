name: Release v0.2.1

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.2.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          test -s Media/Voice/bloodlust-ready.ogg
          test -s Media/Voice/potion-ready.ogg
          grep -q 'Bloodlust Ready' Core.lua
          grep -q 'Potion Ready' Core.lua
          grep -q '## Version: 0.2.1' GenericVoiceMedia.toc

      - name: Build addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/GenericVoiceMedia
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/GenericVoiceMedia/
          cd dist
          zip -r GenericVoiceMedia-v0.2.1.zip GenericVoiceMedia

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.1 \
            dist/GenericVoiceMedia-v0.2.1.zip \
            --target "${GITHUB_SHA}" \
            --title "GenericVoiceMedia v0.2.1" \
            --notes "Adds GVM - Bloodlust Ready and GVM - Potion Ready generic voice callouts, mastered to match the current louder alert mix."

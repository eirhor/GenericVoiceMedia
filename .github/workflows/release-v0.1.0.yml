name: Release v0.1.0

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/GenericVoiceMedia
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            ./ dist/GenericVoiceMedia/
          cd dist
          zip -r GenericVoiceMedia-v0.1.0.zip GenericVoiceMedia

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.0 \
            dist/GenericVoiceMedia-v0.1.0.zip \
            --title "GenericVoiceMedia v0.1.0" \
            --notes "Initial test release. Includes five generic prerecorded LibSharedMedia sounds: Ready, Available, Cooldown Ready, Soon, and Now."

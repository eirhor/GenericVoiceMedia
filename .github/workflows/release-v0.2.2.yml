name: Release v0.2.2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.2.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          test -s Media/Voice/stoneform.ogg
          for sound in ams amz ibf deaths-advance death-charge; do
            test -s "Media/Voice/DeathKnight/${sound}.ogg"
          done

      - name: Build addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/GenericVoiceMedia
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/GenericVoiceMedia/
          cd dist
          zip -r GenericVoiceMedia-v0.2.2.zip GenericVoiceMedia

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.2 \
            dist/GenericVoiceMedia-v0.2.2.zip \
            --target "${GITHUB_SHA}" \
            --title "GenericVoiceMedia v0.2.2" \
            --notes "Adds Death Knight defensive callouts (AMS, AMZ, IBF, Death's Advance, Death Charge) plus the generic Stoneform callout."
